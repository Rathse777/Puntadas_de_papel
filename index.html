<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntadas de Papel - Tienda Oficial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CABECERA DE LA TIENDA -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-container">
                <h1 class="logo-text">Puntadas de Papel</h1>
            </div>
            
            <!-- Menú de Navegación entre Categorías -->
            <nav class="category-nav">
                <a href="index.html" class="active">Todos</a>
                <a href="tejido.html">Tejido</a>
                <a href="papeleria.html">Papelería</a>
                <a href="perfumes.html">Perfumes</a>
                <a href="flores.html">Flores</a>
            </nav>

            <a href="#cart-section" class="cart-icon-btn">
                🛒 (<span id="cart-count">0</span>)
            </a>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL: data-category="all" muestra todo -->
    <main class="store-container" data-category="all">
        
        <main class="store-container">
        <section class="catalog-section">
            <h2 class="section-title">Dulces Creaciones</h2>
            <div id="products-grid" class="products-grid"></div>
        </section>
    
        <!-- SECCIÓN DE CARRITO DE COMPRAS -->
        <aside id="cart-section" class="cart-section">
            <h2>Tu Carrito</h2>
            <div id="cart-items-container"></div>
            <div class="cart-summary">
                <p><strong>Total:</strong> $<span id="cart-total-amount">0.00</span></p>
                <button class="btn-checkout" onclick="showCheckoutForm()">Finalizar Pedido</button>
            </div>
        </aside>

        <!-- FORMULARIO DE CHECKOUT (Oculto por defecto) -->
        <div id="checkout-section" class="checkout-modal" style="display:none;">
            <div class="checkout-content">
                <h3>Datos de Entrega</h3>
                <form id="checkout-form" onsubmit="sendWhatsAppOrder(event)">
                    <label>Nombre:</label>
                    <input type="text" id="cust-name" required>
                    <label>Teléfono:</label>
                    <input type="tel" id="cust-phone" required>
                    <label>Dirección/Notas:</label>
                    <textarea id="cust-address" required></textarea>
                    <button type="submit" class="btn-send-wa">Enviar pedido por WhatsApp 📲</button>
                    <button type="button" class="btn-cancel" onclick="hideCheckoutForm()">Cancelar</button>
                </form>
            </div>
        </div>

    </main>

    <!-- MODAL DE DETALLES DE PRODUCTO -->
    <div id="product-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('product-modal')">&times;</span>
            <div id="modal-product-details"></div>
        </div>
    </div>

    <!-- SCRIPTS EN ORDEN CORRECTO -->
    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
